<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Gators Softball</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://use.typekit.net/gcz6fqf.css">
        <link rel="icon" type="image/png" href="pictures/sunflowerLogo.png" />
    </head>

    <body>
        <header>
            <nav
                class="nav justify-content-center position-relative"
            >
                <a class="nav-logo" href="index.html">
                    <img src="pictures/sunflowerLogo.png" alt="Sunflower logo" />
                </a>
                <a class="nav-link" href="about.html" aria-current="page"
                    >About the Team</a
                >
                <a class="nav-link" href="roster.html">Roster</a>
            </nav>
            
        </header>
        <main>
<div
    id="floridaCarousel"
    class="carousel slide"
    data-bs-ride="carousel"
    data-bs-interval="3000"
>
        <div class="carousel-indicators">
            <button
                type="button"
                data-bs-target="#floridaCarousel"
                data-bs-slide-to="0"
                class="active"
            ></button>
            <button
                type="button"
                data-bs-target="#floridaCarousel"
                data-bs-slide-to="1"
            ></button>
            <button
                type="button"
                data-bs-target="#floridaCarousel"
                data-bs-slide-to="2"
            ></button>
            <button
                type="button"
                data-bs-target="#floridaCarousel"
                data-bs-slide-to="3"
            ></button>
        </div>

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img
                    src="pictures/floridaCarousel1.png"
                    class="d-block w-100"
                    alt="Florida softball"
                />
            </div>

            <div class="carousel-item">
                <img
                    src="pictures/floridaCarousel2.png"
                    class="d-block w-100"
                    alt="Florida softball"
                />
            </div>
            <div class="carousel-item">
                <img
                    src="pictures/floridaCarousel3.png"
                    class="d-block w-100"
                    alt="Florida softball"
                />
            </div>

            <div class="carousel-item">
                <img
                    src="pictures/floridaCarousel4.png"
                    class="d-block w-100"
                    alt="Florida softball"
                />
            </div>
        </div>

        <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#floridaCarousel"
            data-bs-slide="prev"
        >
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#floridaCarousel"
            data-bs-slide="next"
        >
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    



</main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="players.js"></script>
        <script src="script.js"></script>
    </body>
</html>
