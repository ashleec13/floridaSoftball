<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Gators Softball</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://use.typekit.net/gcz6fqf.css">
        <link rel="icon" type="image/png" href="pictures/sunflowerLogo.png" />
    </head>

    <body>
        <header>
            <nav
                class="nav justify-content-center position-relative"
            >
                <a class="nav-logo" href="index.html">
                    <img src="pictures/sunflowerLogo.png" alt="Sunflower logo" />
                </a>
                <a class="nav-link" href="about.html" aria-current="page"
                    >About the Team</a
                >
                <a class="nav-link" href="roster.html">Roster</a>
            </nav>
            
        </header>
<main class="container-fluid py-5 roster-page">
    <div class="container">
        <div class="roster-title text-center">
            <h1 class="roster-heading">Gator Softball Roster</h1>
        </div>

        <div class="card filter-panel p-4 mb-5 shadow-sm">
            <div class="row g-3 justify-content-center">
                <div class="col-md-3">
                    <input type="text" id="playerSearch" class="form-control" placeholder="Search by name...">
                </div>

                <div class="col-md-2">
                    <select id="posFilter" class="form-select">
                    <option value="All">All Positions</option>
                    <option value="Infield">Infield</option>
                    <option value="Outfield">Outfield</option>
                    <option value="Pitcher/Catcher">Pitcher/Catcher</option>
                    <option value="Utility">Utility</option>
                </select>
            </div>

            <div class="col-md-2">
                <select id="classFilter" class="form-select">
                    <option value="All">All Classes</option>
                    <option value="Freshman">Freshman</option>
                    <option value="Sophomore">Sophomore</option>
                    <option value="Junior">Junior</option>
                    <option value="Senior">Senior</option>
                    <option value="Graduate">Graduate</option>
                </select>
            </div>

            <div class="col-md-2">
                <select id="homeFilter" class="form-select">
                    <option value="All">All Regions</option>
                    <option value="Northeast">Northeast</option>
                    <option value="Southeast">Southeast</option>
                    <option value="Midwest">Midwest</option>
                    <option value="West">West</option>
                </select>
            </div>
        </div>
        </div>

        <div id="rosterList" class="row g-4 align-items-stretch"></div>
    </div>

    <div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-uf-orange">
                <div class="modal-header bg-uf-blue text-white">
                    <h5 class="modal-title" id="modalName">Player Name</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center" id="modalContent">
                    </div>
            </div>
        </div>
    </div>
</main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="players.js"></script>
        <script src="script.js"></script>
    </body>
</html>
